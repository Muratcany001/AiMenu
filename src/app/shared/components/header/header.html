<header class="bg-gradient-to-r from-purple-900 via-gray-900 to-purple-600 text-white py-3 border-b-4 border-amber-400 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center">
            <!-- Logo -->
            <div class="flex items-center gap-3" routerLink="/">
                <div class="w-10 h-10 bg-gradient-to-r from-amber-400 to-amber-500 rounded-lg flex items-center justify-center shadow-md">
                    <span class="text-gray-900 font-bold text-lg" routerLink="/">OU</span>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-white tracking-tight" routerLink="/">ORHAN USTA Kebap Salonu</h1>
                    <p class="text-amber-400 text-xs font-medium" routerLink="/">Online menu</p>
                </div>
            </div>

            <!-- Navigation -->
            @if(!isLoggedIn()){
                <nav class="flex items-center gap-3 sm:gap-4 md:gap-6">
                    <a routerLink="/login" 
                       class="text-white-900 hover:text-amber-400 font-medium text-xs sm:text-sm py-2 border-b-2 border-transparent hover:border-amber-400 transition-all duration-300">
                        Giriş Yap
                    </a>
                    <a routerLink="/register" 
                       class="bg-gradient-to-r from-amber-400 to-amber-500 text-gray-900 px-3 sm:px-4 py-2 rounded-lg font-semibold text-xs sm:text-sm shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300">
                        Kayıt Ol
                    </a>
                </nav>
            } @else {
                <nav class="flex items-center gap-3 sm:gap-4 md:gap-6">
                    <a routerLink="/orders" 
                       class="text-white-900 hover:text-amber-400 font-medium text-xs sm:text-sm py-2 border-b-2 border-transparent hover:border-amber-400 transition-all duration-500">
                        Siparişlerim
                    </a>
                    <a (click)="onLogout()" 
                       class="text-white-900 hover:text-amber-400 font-medium text-xs sm:text-sm py-2 border-b-2 border-transparent hover:border-amber-400 transition-all duration-500 cursor-pointer">
                        Çıkış yap
                    </a>
                </nav>
            }
        </div>

    </div>
</header>
