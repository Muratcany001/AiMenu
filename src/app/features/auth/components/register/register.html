<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-200 flex items-center justify-center py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Kayıt Ol</h1>
                <p class="text-gray-600">Yeni hesap oluşturun</p>
            </div>
            
            <!-- Form -->
            <form class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Ad Soyad</label>
                    <input type="text" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-200" 
                           placeholder="Adınızı ve soyadınızı girin">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">E-posta</label>
                    <input type="email" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-200" 
                           placeholder="E-posta adresinizi girin">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Kullanıcı Adı</label>
                    <input type="text" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-200" 
                           placeholder="Kullanıcı adınızı girin">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Şifre</label>
                    <input type="password" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-200" 
                           placeholder="Şifrenizi girin">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Şifre Tekrar</label>
                    <input type="password" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-200" 
                           placeholder="Şifrenizi tekrar girin">
                </div>
                
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-purple-600 to-purple-700 text-white py-3 px-4 rounded-lg font-semibold hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300">
                    Kayıt Ol
                </button>
                
                <div class="text-center">
                    <p class="text-gray-600">
                        Zaten hesabınız var mı? 
                        <a routerLink="/login" class="text-purple-600 hover:text-purple-700 font-semibold transition-colors duration-200">
                            Giriş Yap
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
