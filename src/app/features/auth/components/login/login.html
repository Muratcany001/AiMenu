<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-200 flex items-center justify-center py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Giriş Yap</h1>
                <p class="text-gray-600">Hesabınıza giriş yapın</p>
            </div>
            
            <!-- Form -->
            <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-6">
                <div >
                    <label class="block text-sm font-medium text-gray-700 mb-2">Kullanıcı Adı</label>
                    <input type="text" 
                    formControlName="email"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-200" 
                           placeholder="Kullanıcı adınızı girin">
                           <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-red-500 text-xs mt-1 ml-1">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">Email alanı zorunludur.</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Geçerli bir email giriniz.</span>
          </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Şifre</label>
                    <input type="password" 
                    formControlName="password"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-200" 
                           placeholder="Şifrenizi girin">
                <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid "class="text-red-500 text-xs mt-1 ml-1">
                        Sifre girisi zorunludur
                </div>
                </div>
                @if (errorMessage) {
                <div class="text-red-500 text-lg">
                    {{ errorMessage }}
                </div>
                }
                <button type="submit" 
                    [disabled]="isLoading || loginForm.invalid"
                    
                        class="w-full bg-gradient-to-r from-purple-600 to-purple-700 text-white py-3 px-4 rounded-lg font-semibold hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300">
                    Giriş Yap
                </button>
                
                <div class="text-center">
                    <p class="text-gray-600">
                        Hesabınız yok mu? 
                        <button routerLink="/register" class="text-purple-600 hover:text-purple-700 font-semibold transition-colors duration-200">
                            Kayıt Ol
                        </button>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
