<div class="min-h-screen bg-gradient-to-br from-slate-100 to-slate-300 py-8">
    <div class="max-w-6xl mx-auto px-4 sm:px-8 lg:px-12">
        <h1 class="text-4xl md:text-5xl font-extrabold text-gray-800 mb-6 tracking-tight drop-shadow-sm">
            Admin paneline hos geldiniz.
        </h1>   
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-8 mb-12">
            <!-- set admin menu items here -->
        </div>  
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <div class="flex flex-col md:items-center gap-6 ">
                <span class="text-4xl font-bold text-gray-700 mb-2 md:mb-0">Mevcut Menü Listesi</span>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full relative group overflow-hidden"> 
                @for (item of products; track item.id) {
                <app-menu-item [product]="item"></app-menu-item>

                <button 
                (click)="onDeleteItem(item.id)" 
                class="mt-2 w-full bg-red-100 text-red-600 border border-red-200 hover:bg-red-600 hover:text-white py-2 rounded-lg font-bold transition-all duration-300 flex items-center justify-center gap-2 group-hover:shadow-md   ">
                
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                Menüyü Sil
            </button>

                }
                @empty {
                    <div class="col-span-full text-center py-12">
                        <p class="text-gray-600 text-lg">Gösterilecek menü bulunamadı.</p>
                    </div>
                }
                </div>
            </div>
        </div>
        <div class="flex gap-4 justify-end">
            
            <button (click)="openAddModal()" class="bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-700 hover:to-purple-600 text-white py-3 px-6 rounded-xl font-semibold text-base shadow-lg hover:shadow-xl transition-transform duration-200 transform hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-purple-400">
                Menü Ekle
            </button>
            
        </div>
        @if (isAddModalOpen) {
    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[9999]">
        
        <div class="relative bg-white rounded-xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            
            <button (click)="closeAddModal()" class="absolute top-4 right-4 text-red-500 font-bold text-xl z-50">
                X
            </button>

            <app-add-item></app-add-item>

        </div>
    </div>
}
    </div>
</div>
