<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-200 py-4 md:py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Başlık Bölümü -->
        <div class="text-center mb-8 md:mb-12">
            <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold text-gray-900 mb-2 tracking-tight">
                Menü Listesi
            </h1>
            <p class="text-lg md:text-xl text-purple-600 font-medium">
                Lezzetli yemeklerimizi keşfedin
            </p>
        </div>

        <!-- Arama Bölümü -->
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 mb-8 md:mb-12">
            <div class="text-center mb-6">
                <h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">Arama Yap</h2>
                <p class="text-gray-600">İstediğiniz yemeği kolayca bulun</p>
            </div>
            
            <!-- Arama Input -->
            <div class="relative mb-6">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <svg class="h-6 w-6 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text" 
                       class="w-full pl-12 pr-4 py-4 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-300 text-lg"
                       placeholder="Yemek adı, malzeme veya kategori arayın...">
                <button class="absolute inset-y-0 right-0 pr-4 flex items-center">
                    <svg class="h-6 w-6 text-purple-500 hover:text-purple-700 transition-colors duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                    Sil
                </button>
            </div>

            <!-- Hızlı Filtreler -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                <button class="flex items-center justify-center px-4 py-3 bg-gradient-to-r from-purple-600 to-purple-700 text-white rounded-lg font-semibold text-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300">
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    Popüler
                </button>
                <button class="flex items-center justify-center px-4 py-3 bg-white text-purple-600 border-2 border-purple-600 rounded-lg font-semibold text-sm hover:bg-purple-600 hover:text-white transition-all duration-300">
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Günün menüsü
                </button>
                <button class="flex items-center justify-center px-4 py-3 bg-white text-purple-600 border-2 border-purple-600 rounded-lg font-semibold text-sm hover:bg-purple-600 hover:text-white transition-all duration-300">
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4"></path>
                    </svg>
                    Filtrele
                </button>
            </div>

            <!-- Arama Sonuçları İstatistikleri -->
            <div class="flex flex-wrap items-center justify-between text-sm text-gray-600">
                <div class="flex items-center">
                    <svg class="h-4 w-4 mr-2 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                    <span class="font-semibold text-purple-600">24</span> yemek bulundu
                </div>
                <div class="flex items-center space-x-4">
                    <button class="flex items-center text-gray-500 hover:text-purple-600 transition-colors duration-200">
                        <svg class="h-4 w-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                        </svg>
                        Sırala
                    </button>
                    <button class="flex items-center text-gray-500 hover:text-purple-600 transition-colors duration-200">
                        <svg class="h-4 w-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                        </svg>
                        Liste
                    </button>
                </div>
            </div>
        </div>

        <!-- Menü Kategorileri -->
        <div class="flex flex-wrap justify-center gap-3 md:gap-4 mb-8 md:mb-12">
            <button class="px-4 py-2 md:px-6 md:py-3 bg-gradient-to-r from-purple-600 to-purple-700 text-white rounded-lg font-semibold text-sm md:text-base shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300">
                Tümü
            </button>
            <button class="px-4 py-2 md:px-6 md:py-3 bg-white text-purple-600 border-2 border-purple-600 rounded-lg font-semibold text-sm md:text-base hover:bg-purple-600 hover:text-white transition-all duration-300">
                Ana Yemekler
            </button>
            <button class="px-4 py-2 md:px-6 md:py-3 bg-white text-purple-600 border-2 border-purple-600 rounded-lg font-semibold text-sm md:text-base hover:bg-purple-600 hover:text-white transition-all duration-300">
                İçecekler
            </button>
            <button class="px-4 py-2 md:px-6 md:py-3 bg-white text-purple-600 border-2 border-purple-600 rounded-lg font-semibold text-sm md:text-base hover:bg-purple-600 hover:text-white transition-all duration-300">
                Tatlılar
            </button>
        </div>

        <!-- Menü Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
            <!-- Menu Item'lar buraya gelecek -->
            <app-daily-menu></app-daily-menu>
            <app-menu-item></app-menu-item>
            <app-menu-item></app-menu-item>
            <app-menu-item></app-menu-item>
            <app-menu-item></app-menu-item>
            <app-menu-item></app-menu-item>
            <app-menu-item></app-menu-item>
            <app-menu-item></app-menu-item>
            <app-menu-item></app-menu-item>
            <app-menu-item></app-menu-item>
        </div>
    </div>
</div>
