<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-200 py-4 md:py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Başlık Bölümü -->
        <div class="text-center mb-8 md:mb-12">
            <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold text-gray-900 mb-2 tracking-tight">
                HOŞ GELDİNİZ
            </h1>
            <p class="text-lg md:text-xl text-purple-600 font-medium">
                Lezzetli yemeklerimizi keşfedin
            </p>
        </div>

        <!-- Arama Bölümü -->
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 mb-8 md:mb-12">
            <div class="text-center mb-6">
                <h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">Arama Yap</h2>
                <p class="text-gray-600"></p>
            </div>
            
            <!-- Arama Input -->
            <form [formGroup]="searchForm" (ngSubmit)="onSearchMenuItems()">
            <div class="relative mb-6">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    
                </div>
                <input type="text" 
                        formControlName="searchTerm"
                       class="w-full pl-12 pr-4 py-4 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-300 text-lg"
                       placeholder="Örneğin: Et yemek istiyorum, Tavuğa alerjim var veya bu gün yağsız beslenmek istiyorum diyebilirsiniz.">
                <!--  Aria labeli tasarimi bozmasin diye ve okuyucu modunda gorunmesi icin ARIA-LABEL ekledik -->
                
                <!-- Arama butonu -->
                <div class="absolute inset-y-0 right-0 flex">
                <button (click)="onSearchMenuItems()" aria-label="Ara" class="pr-4  items-center bg-purple-600 text-white  px-4 py-4 hover:bg-purple-700 transition-colors duration-300">
                <svg class="h-7 w-7 text-white-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>       
                <!-- Temizleme butonu -->
                <button (click)="onClearSearch()" class="bg-purple-600 text-white rounded-r-xl px-4 py-4 
                hover:bg-purple-700 transition-colors duration-500
                border-y-2 border-r-2 border-purple-600
                -ml-px" aria-label="temizle">
                    <svg class="h-7 w-7 text-white-900 hover:text-purple-700 transition-colors duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
                </div>
            </div>
            </form>
            <!-- Arama Sonuçları İstatistikleri -->
            <div class="flex flex-wrap items-center justify-between text-sm text-gray-600">
                <div class="flex items-center">
                </div>
                <div class="flex items-center space-x-4">
                </div>
            </div>
        </div>

        <!-- Menü Kategorileri -->
        <div class="flex flex-wrap justify-center gap-3 md:gap-4 mb-8 md:mb-12">
            <button (click)="refreshMenuItems()" class="px-4 py-2 md:px-6 md:py-3 bg-gradient-to-r from-purple-600 to-purple-700 text-white rounded-lg font-semibold text-sm md:text-base shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300">
                Tümü
            </button>
            <button (click)="getMenuItemsByCategory('Günün menüsü')" class="px-4 py-2 md:px-6 md:py-3 bg-white text-purple-600 border-2 border-purple-600 rounded-lg font-semibold text-sm md:text-base hover:bg-purple-600 hover:text-white transition-all duration-300">
                Günün Menüsü
            </button>
            <button (click)="getMenuItemsByCategory('Ana Yemek')" class="px-4 py-2 md:px-6 md:py-3 bg-white text-purple-600 border-2 border-purple-600 rounded-lg font-semibold text-sm md:text-base hover:bg-purple-600 hover:text-white transition-all duration-300">
                Ana Yemekler
            </button>
            <button (click)="getMenuItemsByCategory('İçecek')" class="px-4 py-2 md:px-6 md:py-3 bg-white text-purple-600 border-2 border-purple-600 rounded-lg font-semibold text-sm md:text-base hover:bg-purple-600 hover:text-white transition-all duration-300">
                İçecekler
            </button>
            <button (click)="getMenuItemsByCategory('Tatlı')" class="px-4 py-2 md:px-6 md:py-3 bg-white text-purple-600 border-2 border-purple-600 rounded-lg font-semibold text-sm md:text-base hover:bg-purple-600 hover:text-white transition-all duration-300">
                Tatlılar
            </button>
        </div>

        <!-- Menü Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
            @for (item of products; track item.id) {
                <app-menu-item [product]="item"></app-menu-item>
            }
            @empty {
                <div class="col-span-full text-center py-12">
                    <p class="text-gray-600 text-lg">Gösterilecek menü bulunamadı.</p>
                </div>
            }
        </div>
    </div>
</div>
